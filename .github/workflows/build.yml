name: PiP azkar POC build

# Compile check for the standalone PiPAzkarPOC project (no signing, no device).
on:
  push:
    branches: [main, 'feature/**', 'claude/**']
  workflow_dispatch:

jobs:
  core-tests:
    name: IslamicCore tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Bundled content matches upstream sources
        run: python3 tools/content/build_content.py --check

      - name: Hisn correction manifest rules
        run: python3 tools/content/test_hisn_corrections.py

      - name: Hisn editorial review gate
        run: python3 tools/content/test_hisn_editorial_review.py

      - name: Hisn audio test fixture is reproducible
        run: python3 tools/content/make_hisn_audio_fixture.py --check

      - name: Bundled audio packs are intact (release status is reported)
        run: python3 tools/content/check_audio_packs.py

      - name: swift test
        working-directory: Packages/IslamicCore
        env:
          # PiPFramePreviewTests writes PNG previews of PiP frames here (test output only;
          # nothing of it is in the app).
          PIP_PREVIEW_DIR: ${{ github.workspace }}/pip-frame-previews
        run: |
          set -o pipefail
          swift --version
          swift test 2>&1 | tee ../../core-tests.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-tests-log
          path: core-tests.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-frame-previews
          path: pip-frame-previews
          if-no-files-found: ignore

  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Debug -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO build | tee device-build.log | grep -E 'error|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' device-build.log

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tee sim-build.log | grep -E 'error|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' sim-build.log

      - name: Check Info.plist background mode
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -path '*Debug-iphoneos/IslamicPiPPOC.app' | head -1)
          plutil -p "$APP/Info.plist" | tee /dev/stderr | grep -A2 UIBackgroundModes | grep -q audio

      - name: Package unsigned IPA (same steps as codemagic.yaml)
        run: |
          set -o pipefail
          sed -i '' "s/com\.example\.IslamicPiPPOC/com.azkar.pippoc/g" IslamicPiPPOC.xcodeproj/project.pbxproj
          xcodebuild build -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -3
          APP=build/DerivedData/Build/Products/Debug-iphoneos/IslamicPiPPOC.app
          mkdir -p build/ipa/Payload && cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry IslamicPiPPOC.ipa Payload)
          ls -lh build/ipa/IslamicPiPPOC.ipa
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: IslamicPiPPOC-unsigned-ipa
          path: build/ipa/IslamicPiPPOC.ipa

      - name: Production app has no test audio
        run: |
          APP=build/DerivedData/Build/Products/Debug-iphoneos/IslamicPiPPOC.app
          if find "$APP" -iname 'test-*' -o -name 'HisnAudioFixture' -o -name '*.device-test.json' | grep .; then
            echo "test audio found in the production app"; exit 1
          fi
          # Debug builds keep the code in IslamicPiPPOC.debug.dylib, so search every file.
          if grep -rlaF 'HisnAudioFixture' "$APP"; then
            echo "fixture code found in the production app"; exit 1
          fi

      # Release configuration, as App Store builds use, unsigned (signing is the owner's).
      - name: Release build (unsigned) and bundle checks
        run: |
          set -o pipefail
          xcodebuild build -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ReleaseDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee release-build.log | grep -E 'error|warning:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' release-build.log
          APP=build/ReleaseDerivedData/Build/Products/Release-iphoneos/IslamicPiPPOC.app
          plutil -p "$APP/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist"
          if grep -rlaF 'HisnAudioFixture' "$APP"; then echo "fixture code in the Release app"; exit 1; fi
          if find "$APP" -iname 'test-*' -o -name '*.device-test.json' | grep .; then echo "test audio in the Release app"; exit 1; fi
          # The only permission usage string is location while in use (prayer times and Qibla,
          # computed on the device). Notifications need none; no other permission is asked for.
          USAGE=$(plutil -p "$APP/Info.plist" | grep -oE 'NS[A-Za-z]+UsageDescription' | sort -u | tr '\n' ',')
          echo "Release usage descriptions: $USAGE"
          [ "$USAGE" = "NSLocationWhenInUseUsageDescription," ] || { echo "unexpected usage description"; exit 1; }
          # The only background mode is the PiP one ("Audio, AirPlay, and Picture in Picture"),
          # owner decision 2026-10-09. No audio file ships, so nothing plays in the background.
          MODES=$(/usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" "$APP/Info.plist" 2>/dev/null | tr -d ' {}' | grep . | sort | tr '\n' ',')
          echo "Release background modes: $MODES"
          [ "$MODES" = "Array,audio," ] || { echo "Release background modes must be exactly [audio] for PiP"; exit 1; }
          # The widget extension is WidgetKit only: no permission string, no background mode,
          # its own privacy manifest. NSWidgetWantsLocation lets it use the app's "when in use"
          # location for «موقعي الحالي»; it adds no permission prompt of its own. The app opens azkarapp:// links from it and from shortcuts.
          WIDGET="$APP/PlugIns/AzkarWidgetsExtension.appex"
          test -d "$WIDGET" || { echo "widget extension missing from the Release app"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET/Info.plist")" = "com.apple.widgetkit-extension" ] \
            || { echo "unexpected extension point"; exit 1; }
          if plutil -p "$WIDGET/Info.plist" | grep -E 'UsageDescription|UIBackgroundModes'; then
            echo "the widget extension must not ask for permissions or background modes"; exit 1
          fi
          test -f "$WIDGET/PrivacyInfo.xcprivacy"
          plutil -lint "$WIDGET/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c "Print :CFBundleURLTypes:0:CFBundleURLSchemes:0" "$APP/Info.plist" | grep -qx azkarapp \
            || { echo "azkarapp URL scheme missing"; exit 1; }
          # Both targets name the same App Group, from the one AZKAR_APP_GROUP setting. Unsigned
          # builds carry no entitlements, so the source files and Info.plists are what is checked;
          # registering the group is the owner's (docs/DAILY_COMPANION.md §13).
          APP_GROUP=$(/usr/libexec/PlistBuddy -c "Print :AzkarAppGroup" "$APP/Info.plist")
          WIDGET_GROUP=$(/usr/libexec/PlistBuddy -c "Print :AzkarAppGroup" "$WIDGET/Info.plist")
          echo "App Group: $APP_GROUP"
          [ -n "$APP_GROUP" ] && [ "$APP_GROUP" = "$WIDGET_GROUP" ] || { echo "app and widget name different App Groups"; exit 1; }
          case "$APP_GROUP" in group.*) ;; *) echo "an App Group id starts with group."; exit 1 ;; esac
          for E in IslamicPiPPOC.entitlements AzkarWidgets.entitlements; do
            [ "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$E")" = '$(AZKAR_APP_GROUP)' ] \
              || { echo "$E must name the group through AZKAR_APP_GROUP"; exit 1; }
          done
          if find "$APP" \( -iname '*.wav' -o -iname '*.caf' -o -iname '*.m4a' -o -iname '*.mp3' -o -iname '*.aac' -o -iname '*.aiff' \) | grep .; then
            echo "audio file in the Release app: no silent or test audio may keep it in the background"; exit 1
          fi
          # The PiP test screen and its engine are Debug-only; production PiP (PiPCore) ships.
          if grep -rlaF 'PiPTestEngine' "$APP"; then echo "PiP test engine in the Release app"; exit 1; fi
          if grep -rlaF 'PiP Technical Test' "$APP"; then echo "PiP test screen in the Release app"; exit 1; fi
          grep -rlaF 'PiPEngine' "$APP" > /dev/null || { echo "production PiP engine missing"; exit 1; }
          # The production PiP of every section ships in Release, not behind a Debug switch.
          # Byte search (UTF-8), so the Arabic button titles do not depend on grep's locale.
          python3 - "$APP" <<'PY'
          import os, sys
          app = sys.argv[1]
          blobs = []
          for root, _, files in os.walk(app):
              for name in files:
                  with open(os.path.join(root, name), 'rb') as f:
                      blobs.append(f.read())
          needed = ['SampleBufferPiPController', 'PiPFrameRenderer', 'QuranPiPProvider', 'HisnPiPProvider',
                    'AdhkarPiPProvider', 'DuaPiPProvider', 'تشغيل في نافذة عائمة', 'إغلاق النافذة العائمة']
          missing = [s for s in needed if not any(s.encode('utf-8') in b for b in blobs)]
          if missing:
              sys.exit('production PiP missing from Release: ' + ', '.join(missing))
          print('production PiP present in Release:', ', '.join(needed))
          PY
          find "$APP" -name '*.ttf' -o -name '*.json' | sed "s|$APP/||" | sort
          du -sh "$APP"

      - name: Release archive (unsigned) and IPA from the archive
        run: |
          set -o pipefail
          xcodebuild archive -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/IslamicPiPPOC.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee archive.log | grep -E 'error|warning:|ARCHIVE' || true
          grep -q 'ARCHIVE SUCCEEDED' archive.log
          /usr/libexec/PlistBuddy -c "Print :ApplicationProperties" build/IslamicPiPPOC.xcarchive/Info.plist
          mkdir -p build/release-ipa/Payload
          cp -R build/IslamicPiPPOC.xcarchive/Products/Applications/IslamicPiPPOC.app build/release-ipa/Payload/
          # The build number (shown in Settings › About) and the file name say which run and
          # commit this is, so a tester can tell a new IPA from an old one.
          APP=build/release-ipa/Payload/IslamicPiPPOC.app
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "${{ github.run_number }}" ]
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/PlugIns/AzkarWidgetsExtension.appex/Info.plist")" = "${{ github.run_number }}" ]
          NAME="IslamicPiPPOC-release-unsigned-build${{ github.run_number }}-${GITHUB_SHA::7}.ipa"
          (cd build/release-ipa && zip -qry "$NAME" Payload)
          ls -lh "build/release-ipa/$NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: IslamicPiPPOC-release-unsigned-ipa-NOT-SIGNED
          path: build/release-ipa/*.ipa

      # Device-test build for Phase 3C (not for release): compiled with HISN_AUDIO_FIXTURE, it
      # carries the TEST_ONLY synthetic tone and its manifest so Hisn audio and PiP can be
      # tried on a device before any production recording exists.
      - name: Package unsigned fixture IPA (device testing only)
        run: |
          set -o pipefail
          xcodebuild build -project IslamicPiPPOC.xcodeproj -scheme IslamicPiPPOC \
            -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/FixtureDerivedData \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG HISN_AUDIO_FIXTURE' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -3
          APP=build/FixtureDerivedData/Build/Products/Debug-iphoneos/IslamicPiPPOC.app
          FIX=Packages/IslamicCore/Tests/HisnAudioTests/Fixtures
          grep -rlaF 'HisnAudioFixture' "$APP"   # the fixture code is compiled in
          mkdir -p "$APP/HisnAudioFixture"
          cp "$FIX/hisn_audio.device-test.json" "$FIX/HisnAudio/test-tone-30s.wav" "$APP/HisnAudioFixture/"
          mkdir -p build/fixture-ipa/Payload && cp -R "$APP" build/fixture-ipa/Payload/
          (cd build/fixture-ipa && zip -qry IslamicPiPPOC-hisn-audio-fixture.ipa Payload)
          ls -lh build/fixture-ipa/IslamicPiPPOC-hisn-audio-fixture.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IslamicPiPPOC-hisn-audio-fixture-unsigned-ipa-NOT-FOR-RELEASE
          path: build/fixture-ipa/IslamicPiPPOC-hisn-audio-fixture.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-azkar-build-logs
          path: '*-build.log'
          if-no-files-found: ignore
