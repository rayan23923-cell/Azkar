name: Fetch Tanzil source (temporary)

# One-off: the build container cannot reach tanzil.net, so the runner downloads the
# unmodified Tanzil files and commits them under Packages/IslamicCore/Upstream/tanzil.
on:
  push:
    branches: [feature/v1-phase-2-content]
    paths: [.github/workflows/tanzil-fetch.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          set -ex
          D=Packages/IslamicCore/Upstream/tanzil
          mkdir -p $D
          Q="marks=true&sajdah=true&rub=true&alef=true&tatweel=true&quranType=uthmani&agree=true"
          curl -fsSL -A "Mozilla/5.0" -o $D/quran-uthmani.xml "https://tanzil.net/pub/download/index.php?$Q&outType=xml"
          curl -fsSL -A "Mozilla/5.0" -o $D/quran-uthmani.txt "https://tanzil.net/pub/download/index.php?$Q&outType=txt-2"
          curl -fsSL -A "Mozilla/5.0" -o $D/quran-data.xml "https://tanzil.net/res/text/metadata/quran-data.xml"
          ls -la $D
          sha256sum $D/*
          head -c 1500 $D/quran-uthmani.xml; echo; tail -c 2500 $D/quran-uthmani.xml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages/IslamicCore/Upstream/tanzil
          git commit -m "Add unmodified Tanzil Uthmani text and metadata (fetched by CI)" || echo "nothing to commit"
          git push
