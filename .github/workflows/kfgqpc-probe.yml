name: research fetch (temporary, not for merge)
on:
  push:
    branches: ['scratch/kfgqpc-probe']
    paths: ['probe/step.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Hisn sources
        run: python3 probe/fetch_hisn.py; tail -5 probe/hisn/fetch.log
      - name: PDF text and info
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils >/dev/null
          if [ -f probe/hisn/author.pdf ]; then
            pdfinfo probe/hisn/author.pdf > probe/hisn/author.pdfinfo.txt || true
            pdftotext -layout probe/hisn/author.pdf probe/hisn/author.layout.txt || true
            pdftotext -raw probe/hisn/author.pdf probe/hisn/author.raw.txt || true
            pdffonts probe/hisn/author.pdf > probe/hisn/author.pdffonts.txt || true
            rm probe/hisn/author.pdf
          fi
      - name: Commit text results
        run: |
          git config user.name probe-bot; git config user.email probe@example.invalid
          git add probe/hisn
          git commit -qm "hisn fetch results" || true
          git push
