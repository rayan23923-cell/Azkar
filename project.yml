# Fallback only: if the .xcodeproj does not open, run `brew install xcodegen && xcodegen` here.
name: IslamicPiPPOC
packages:
  IslamicCore:
    path: Packages/IslamicCore
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The App Group the app shares the prayer settings with the widgets through.
    AZKAR_APP_GROUP: group.com.example.IslamicPiPPOC
targets:
  IslamicPiPPOC:
    type: application
    platform: iOS
    sources: [IslamicPiPPOC]
    dependencies:
      - package: IslamicCore
        product: IslamicCore
      - package: IslamicCore
        product: HisnReading
      - package: IslamicCore
        product: HisnAudioPlayback
      - package: IslamicCore
        product: HisnShareCard
      - package: IslamicCore
        product: GlobalSearch
      - package: IslamicCore
        product: AdhkarReading
      - package: IslamicCore
        product: QuranText
      - package: IslamicCore
        product: QuranReading
      - package: IslamicCore
        product: ContentKit
      - package: IslamicCore
        product: PiPCore
      - package: IslamicCore
        product: PiPRendering
      - package: IslamicCore
        product: PiPProviders
      - package: IslamicCore
        product: PrayerTimes
      - target: AzkarWidgetsExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IslamicPiPPOC
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: IslamicPiPPOC.entitlements
      configs:
        # Both declare only the PiP background mode (audio). Debug adds the PiP test screen
        # and the fixture IPA; the Release (App Store) build has neither.
        Debug:
          INFOPLIST_FILE: Info-Debug.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "أذكار"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: "5.0"
  # The next-prayer and dhikr-of-the-day widgets (WidgetKit only: no permission, no
  # background mode). Embedded in the app.
  AzkarWidgetsExtension:
    type: app-extension
    platform: iOS
    sources: [AzkarWidgets]
    dependencies:
      - package: IslamicCore
        product: PrayerTimes
      - package: IslamicCore
        product: ContentKit
      - package: IslamicCore
        product: AdhkarReading
      - package: IslamicCore
        product: IslamicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IslamicPiPPOC.Widgets
        INFOPLIST_FILE: AzkarWidgets-Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "أذكار"
        CODE_SIGN_ENTITLEMENTS: AzkarWidgets.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
